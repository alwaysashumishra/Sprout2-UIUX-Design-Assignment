2" fill="#FFFFFF" stroke="#D9E0D8" stroke-width="1"/><text x="28" y="400" font-family="Inter,Arial,sans-serif" font-size="12px" font-weight="400" fill="#66706A" text-anchor="start">Code sent to your mobile number.</text><text x="28" y="430" font-family="Inter,Arial,sans-serif" font-size="13px" font-weight="650" fill="#2F6B4F" text-anchor="start">Resend code in 00:32</text><rect x="28" y="485" width="334" height="66" rx="14" fill="#FFF4E4"/><text x="48" y="513" font-family="Inter,Arial,sans-serif" font-size="12px" font-weight="750" fill="#B47B2C" text-anchor="start">Tip</text><text x="48" y="535" font-family="Inter,Arial,sans-serif" font-size="12px" font-weight="500" fill="#172018" text-anchor="start">Never share your OTP with anyone.</text><rect x="28" y="585" width="334" height="54" rx="14" fill="#2F6B4F"/><text x="195.0" y="618.0" font-family="Inter,Arial,sans-serif" font-size="16px" font-weight="700" fill="#FFFFFF" text-anchor="middle">Verify &amp; continue</text><text x="195" y="670" font-family="Inter,Arial,sans-serif" font-size="12px" font-weight="400" fill="#66706A" text-anchor="middle">Didn&#x27;t receive it? Check your network or resend.</text><text x="28" y="805" font-family="Inter,Arial,sans-serif" font-size="11px" font-weight="500" fill="#66706A" text-anchor="start">We use your number only for verification and updates.</text></svg>